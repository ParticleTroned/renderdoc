name: Build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork release tag (pt-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Prepare fork distribution metadata
      env:
        TAG: ${{ inputs.tag }}
      run: >-
        python util/fork_version.py metadata --expect-tag "$env:TAG"
        --distribution "$env:GITHUB_REPOSITORY"
        --msbuild-props Directory.Build.props
      shell: pwsh

    - name: Download optional 3rdparty extras
      run: |
        curl.exe --fail --location https://renderdoc.org/qrenderdoc_3rdparty.zip -o qrenderdoc_3rdparty.zip
        7z x qrenderdoc_3rdparty.zip
      shell: pwsh

    - uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild.exe renderdoc.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      shell: pwsh

    - name: Package
      env:
        TAG: ${{ inputs.tag }}
      run: Compress-Archive -Path x64/Release/* -DestinationPath "renderdoc-windows-x64-$env:TAG.zip"
      shell: pwsh

    - name: Upload to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
      run: gh release upload "$env:TAG" "renderdoc-windows-x64-$env:TAG.zip" --clobber
      shell: pwsh

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      QT_SELECT: qt5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Prepare fork distribution metadata
      id: version
      env:
        TAG: ${{ inputs.tag }}
      run: >-
        python util/fork_version.py metadata --expect-tag "$TAG"
        --distribution "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev mesa-common-dev libgl1-mesa-dev qtbase5-dev \
          libqt5svg5-dev libqt5x11extras5-dev libxcb-keysyms1-dev libx11-xcb-dev g++

    - name: Build
      env:
        VERSION: ${{ steps.version.outputs.version }}
        DISTRIBUTION: ${{ steps.version.outputs.distribution }}
        CONTACT: ${{ steps.version.outputs.contact }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_VERSION_DIST_NAME="$DISTRIBUTION" \
          -DBUILD_VERSION_DIST_VER="$VERSION" \
          -DBUILD_VERSION_DIST_CONTACT="$CONTACT"
        cmake --build build --parallel

    - name: Package and upload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
      run: |
        tar -czf "renderdoc-linux-x64-${TAG}.tar.gz" -C build/bin .
        gh release upload "$TAG" "renderdoc-linux-x64-${TAG}.tar.gz" --clobber

  publish:
    name: Publish complete release
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Publish after both platform builds succeed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: gh release edit "$TAG" --draft=false
