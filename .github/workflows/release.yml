name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      bump:
        description: Optional release for changes without a semantic bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: particletroned-release
  cancel-in-progress: false

jobs:
  release:
    name: Create fork release
    if: github.repository == 'ParticleTroned/renderdoc'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Test fork versioning
      run: python -m unittest discover -s util -p test_fork_version.py

    - name: Compute independent fork version
      id: version
      env:
        BUMP: ${{ inputs.bump || 'auto' }}
      run: >-
        python util/fork_version.py release --bump "$BUMP"
        --github-output "$GITHUB_OUTPUT" --notes RELEASE_NOTES.md

    - name: Create draft release at the measured commit
      if: steps.version.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
        SOURCE: ${{ steps.version.outputs.source }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Resuming release $TAG"
        else
          gh release create "$TAG" --target "$SOURCE" --title "$TAG" \
            --draft --notes-file RELEASE_NOTES.md
        fi

  build:
    name: Build and publish artifacts
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
